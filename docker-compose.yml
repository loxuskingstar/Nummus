name: nummus

services:
  nummus:
    build: .
    image: nummus:latest
    container_name: nummus
    restart: unless-stopped
    # Les fichiers de ./data appartiennent à votre utilisateur (renseigner NUMMUS_UID/GID dans .env : `id -u`, `id -g`).
    user: "${NUMMUS_UID:-1000}:${NUMMUS_GID:-1000}"
    ports:
      - "${NUMMUS_PORT:-8080}:8000"
    environment:
      NUMMUS_USER: ${NUMMUS_USER:-nummus}
      NUMMUS_PASSWORD: ${NUMMUS_PASSWORD:-}
      NUMMUS_AUTH_MODE: ${NUMMUS_AUTH_MODE:-session}
      NUMMUS_SESSION_DAYS: ${NUMMUS_SESSION_DAYS:-30}
      NUMISTA_API_KEY: ${NUMISTA_API_KEY:-}
      NUMMUS_BACKUP_EVERY_HOURS: ${NUMMUS_BACKUP_EVERY_HOURS:-24}
      NUMMUS_BACKUP_KEEP: ${NUMMUS_BACKUP_KEEP:-7}
      NUMMUS_TRUST_PROXY: ${NUMMUS_TRUST_PROXY:-}
      NUMMUS_WEBDAV_URL: ${NUMMUS_WEBDAV_URL:-}
      NUMMUS_WEBDAV_USER: ${NUMMUS_WEBDAV_USER:-}
      NUMMUS_WEBDAV_PASSWORD: ${NUMMUS_WEBDAV_PASSWORD:-}
      NUMMUS_WEBDAV_EVERY_HOURS: ${NUMMUS_WEBDAV_EVERY_HOURS:-24}
    volumes:
      # Tout ce qui doit survivre ou migrer : data/db, data/logs, data/backups
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
